events {
    # puede quedar vacío
}

http {
  server {
    listen 10000;
    server_name _;

    # Proxy a Rasa
    location /webhooks/telegram/webhook {
      proxy_pass http://127.0.0.1:5005/webhooks/telegram/webhook;
      proxy_set_header Host $host;
    }
    location /webhooks/rest/webhook {
      proxy_pass http://127.0.0.1:5005/webhooks/rest/webhook;
      proxy_set_header Host $host;
    }

    # Status “falso” que siempre devuelve 200 OK
    location /status {
      return 200 "OK";
      add_header Content-Type text/plain;
    }
    # también podrías mapear `/` a lo mismo:
    location = / {
      return 200 "OK";
      add_header Content-Type text/plain;
    }
  }
}