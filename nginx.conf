events { }

http {
server {
    listen       10000;
    server_name  _;

    # Todas las peticiones /webhooks/telegram/webhook las reenviamos a Rasa
    location /webhooks/telegram/webhook {
        proxy_pass http://127.0.0.1:5005/webhooks/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Si quieres exponer el endpoint REST normal de Rasa
    location /webhooks/rest/webhook {
        proxy_pass http://127.0.0.1:5005/webhooks/rest/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Para la interfaz de status (opcional)
    location /status {
        proxy_pass http://127.0.0.1:5005/status;
    }

    # Cualquier otra ruta, si la necesitas
    location / {
        return 200 "Rasa + Nginx en Render\n";
        add_header Content-Type text/plain;
    }
}
}