events {}

http {
  server {
    listen 10000;
    server_name _;

    # Telegram webhook
    location /webhooks/telegram/webhook {
      proxy_pass http://127.0.0.1:5005/webhooks/telegram/webhook;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # REST webhook (para pruebas con curl)
    location /webhooks/rest/webhook {
      proxy_pass http://127.0.0.1:5005/webhooks/rest/webhook;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Status endpoint (opcional)
    location /status {
      proxy_pass http://127.0.0.1:5005/status;
    }

    # Cualquier otra ruta, mensaje simple
    location / {
      return 200 "Rasa + Nginx en Render\n";
      add_header Content-Type text/plain;
    }
  }
}