services:
  - type: web
    name: rasa-bot
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    internalPort: 10000
    # ahora quitamos el "rasa" de delante:
    startCommand: >
      run --enable-api --cors "*"
          --debug
          --interface 0.0.0.0
          --port $PORT
    healthCheckPath: /status