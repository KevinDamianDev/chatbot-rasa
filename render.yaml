services:
  - type: web
    name: chatbot-rasa
    runtime: python
    pythonVersion: 3.10.13
    buildCommand: pip install -r requirements.txt
    startCommand: rasa run --enable-api --cors "*" --port 5005
    plan: free
    region: oregon

  - type: worker
    name: rasa-actions
    runtime: python
    pythonVersion: 3.10.13
    buildCommand: pip install -r requirements.txt
    startCommand: rasa run actions --port 5055
    plan: free
    region: oregon