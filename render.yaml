services:
  - type: web
    name: rasa-bot
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    internalPort: 10000
    envVars:
      - key: RASA_ENVIRONMENT
        value: production
      - key: SANIC_HOST
        value: "0.0.0.0"
      - key: SANIC_WORKERS
        value: "1"
      - key: SANIC_PORT
        value: "10000"
      - key: PORT
        value: "10000"     # <--- así Render comprobará el puerto